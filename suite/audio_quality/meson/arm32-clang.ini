[binaries]
c = ['clang', '--target=arm-linux-gnueabihf']
cpp = ['clang++', '--target=arm-linux-gnueabihf']
c_ld = 'lld'
cpp_ld = 'lld'
ar = 'llvm-ar'
strip = 'llvm-strip'
pkg-config = 'arm-linux-gnueabihf-pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7-a'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
c_args = ['-march=armv7-a', '-mfloat-abi=hard', '-mfpu=vfpv3-d16']
cpp_args = ['-march=armv7-a', '-mfloat-abi=hard', '-mfpu=vfpv3-d16']
