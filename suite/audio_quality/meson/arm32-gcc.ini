[binaries]
c = 'arm-linux-gnueabihf-gcc'
cpp = 'arm-linux-gnueabihf-g++'
ar = 'arm-linux-gnueabihf-ar'
strip = 'arm-linux-gnueabihf-strip'
pkg-config = 'arm-linux-gnueabihf-pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7-a'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
c_args = ['-march=armv7-a', '-mfloat-abi=hard', '-mfpu=vfpv3-d16']
cpp_args = ['-march=armv7-a', '-mfloat-abi=hard', '-mfpu=vfpv3-d16']
